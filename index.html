<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="GRtDQJ2BpUGChbtvJVmupWRxMTszIEmufHkd2qxR2C0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚀 Real Speed Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .card {
            background: #141a24;
            padding: 30px 35px;
            border-radius: 35px;
            max-width: 620px;
            width: 100%;
            border: 1px solid #2a313e;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .vpn-badge {
            background: #1f8b4c;
            padding: 4px 16px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .fast-logo {
            background: #212a36;
            padding: 4px 18px;
            border-radius: 60px;
            font-size: 13px;
            border: 1px solid #33415a;
            color: #b3c2d1;
            font-weight: 700;
        }
        .speed-main {
            font-size: 80px;
            font-weight: 700;
            margin: 5px 0 2px;
            transition: all 0.2s;
            letter-spacing: -2px;
        }
        .speed-main span {
            font-size: 28px;
            color: #9aaec9;
            font-weight: 500;
        }
        .speed-label {
            color: #8b9bb5;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        .status {
            font-size: 13px;
            margin: 5px 0 10px;
            font-weight: 500;
        }
        .status.ready { color: #8bc34a; }
        .status.testing { color: #ffb347; }
        .status.done { color: #4a9eff; }
        .status.error { color: #ff6b6b; }
        
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #29323f;
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0 12px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #1f8b4c, #ffb347);
            border-radius: 10px;
            transition: width 0.15s;
        }
        .speed-row {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }
        .speed-box {
            flex: 1;
            background: #10171f;
            padding: 10px 8px;
            border-radius: 14px;
            border: 1px solid #29323f;
            text-align: center;
        }
        .speed-box .number {
            font-size: 26px;
            font-weight: 700;
        }
        .speed-box .number span {
            font-size: 13px;
            color: #9aaec9;
        }
        .speed-box .label {
            font-size: 10px;
            color: #8b9bb5;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .speed-box.download .number { color: #4a9eff; }
        .speed-box.upload .number { color: #ff6b6b; }
        
        .btn-test {
            background: #1f8b4c;
            border: none;
            color: white;
            font-size: 17px;
            padding: 13px 40px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 8px;
            transition: 0.2s;
            width: 100%;
        }
        .btn-test:hover { background: #23a35a; transform: scale(1.01); }
        .btn-test:active { transform: scale(0.97); }
        .btn-test:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-details {
            background: transparent;
            border: 1px solid #2f3c4e;
            color: #b0c7df;
            padding: 6px 18px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: 0.2s;
            width: 100%;
        }
        .btn-details:hover { background: #1f2937; }
        
        .info-panel {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #29323f;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #10171f;
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }
        .info-item .info-label {
            color: #6f839e;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .info-value {
            color: #d6e4f5;
            font-size: 13px;
            font-weight: 600;
        }
        .info-item .info-value.green { color: #8bc34a; }
        .info-item .info-value.blue { color: #4a9eff; }
        .info-item .info-value.red { color: #ff6b6b; }
        .info-item .info-value.gold { color: #ffb347; }
        .info-item .info-value.purple { color: #b388ff; }
        
        .best-section {
            margin-top: 10px;
            padding: 12px 14px;
            background: #0f1620;
            border-radius: 14px;
            border: 1px solid #1f8b4c33;
        }
        .best-title {
            color: #8b9bb5;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .best-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .best-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }
        .best-item .best-label {
            color: #6f839e;
            font-size: 10px;
            font-weight: 600;
        }
        .best-item .best-value {
            font-weight: 700;
            font-size: 16px;
        }
        .best-item .best-value.download-best { color: #4a9eff; }
        .best-item .best-value.upload-best { color: #ff6b6b; }
        .best-item .best-value.peak-best { color: #ffb347; }
        
        .details-panel {
            display: none;
            margin-top: 12px;
            background: #10171f;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #29323f;
        }
        .details-panel .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #1f2937;
        }
        .details-panel .detail-row:last-child {
            border-bottom: none;
        }
        .details-panel .detail-label {
            color: #6f839e;
            font-size: 12px;
        }
        .details-panel .detail-value {
            color: #d6e4f5;
            font-size: 13px;
            font-weight: 500;
        }
        .real-badge {
            background: #1f8b4c44;
            color: #8bc34a;
            padding: 2px 12px;
            border-radius: 60px;
            font-size: 10px;
            border: 1px solid #1f8b4c66;
        }
        .sim-badge {
            background: #ff6b6b44;
            color: #ff6b6b;
            padding: 2px 12px;
            border-radius: 60px;
            font-size: 10px;
            border: 1px solid #ff6b6b66;
        }
        @media (max-width: 550px) {
            .card { padding: 20px; }
            .speed-main { font-size: 58px; }
            .speed-main span { font-size: 20px; }
            .info-grid { grid-template-columns: 1fr; }
            .best-row { flex-direction: column; gap: 4px; }
            .best-item { justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="vpn-badge">🔒 VPN</div>
            <div class="fast-logo">⚡ fast.com</div>
        </div>

        <!-- Speed -->
        <div class="speed-main" id="mainSpeed">0<span>Mbps</span></div>
        <div class="speed-label">Your Internet speed is</div>
        <div class="status ready" id="statusLabel">● ready</div>

        <!-- Progress -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Download + Upload -->
        <div class="speed-row">
            <div class="speed-box download">
                <div class="number" id="downloadSpeed">0<span>Mbps</span></div>
                <div class="label">▼ Download</div>
            </div>
            <div class="speed-box upload">
                <div class="number" id="uploadSpeed">0<span>Mbps</span></div>
                <div class="label">▲ Upload</div>
            </div>
        </div>

        <!-- Buttons -->
        <button class="btn-test" id="testBtn">▶ Test Now</button>
        <button class="btn-details" id="toggleDetails">📋 Show extra info ▾</button>

        <!-- Info Panel -->
        <div class="info-panel">
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">📡 IP</span>
                    <span class="info-value" id="ipAddress">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🌐 Server</span>
                    <span class="info-value" id="serverInfo">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📶 Latency</span>
                    <span class="info-value gold" id="latencyInfo">-- ms</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📦 Data</span>
                    <span class="info-value purple" id="dataInfo">-- MB</span>
                </div>
            </div>

            <!-- Best Speeds -->
            <div class="best-section">
                <div class="best-title">🏆 Best Speeds (This Session)</div>
                <div class="best-row">
                    <div class="best-item">
                        <span class="best-label">⬇ Download</span>
                        <span class="best-value download-best" id="bestDownload">0 Mbps</span>
                    </div>
                    <div class="best-item">
                        <span class="best-label">⬆ Upload</span>
                        <span class="best-value upload-best" id="bestUpload">0 Mbps</span>
                    </div>
                    <div class="best-item">
                        <span class="best-label">⚡ Peak</span>
                        <span class="best-value peak-best" id="bestPeak">0 Mbps</span>
                    </div>
                </div>
            </div>
            
            <!-- Data Source Badge -->
            <div style="margin-top: 10px; text-align: center;">
                <span id="dataSourceBadge" class="real-badge">🟢 Real Data</span>
            </div>
        </div>

        <!-- Extra Details -->
        <div class="details-panel" id="extraDetails">
            <div class="detail-row">
                <span class="detail-label">🏢 ISP</span>
                <span class="detail-value" id="ispInfo">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🌍 Country</span>
                <span class="detail-value" id="countryInfo">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📌 Location</span>
                <span class="detail-value" id="locationInfo">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🆔 Test ID</span>
                <span class="detail-value" id="testIdInfo">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🕐 Time</span>
                <span class="detail-value" id="timeInfo">--</span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 🚀 ALL ELEMENTS
        // ================================================================
        const mainSpeed = document.getElementById('mainSpeed');
        const downloadSpeed = document.getElementById('downloadSpeed');
        const uploadSpeed = document.getElementById('uploadSpeed');
        const progressFill = document.getElementById('progressFill');
        const statusLabel = document.getElementById('statusLabel');
        const testBtn = document.getElementById('testBtn');
        const toggleDetails = document.getElementById('toggleDetails');
        const extraDetails = document.getElementById('extraDetails');

        const ipAddress = document.getElementById('ipAddress');
        const serverInfo = document.getElementById('serverInfo');
        const latencyInfo = document.getElementById('latencyInfo');
        const dataInfo = document.getElementById('dataInfo');
        const bestDownload = document.getElementById('bestDownload');
        const bestUpload = document.getElementById('bestUpload');
        const bestPeak = document.getElementById('bestPeak');
        const ispInfo = document.getElementById('ispInfo');
        const countryInfo = document.getElementById('countryInfo');
        const locationInfo = document.getElementById('locationInfo');
        const testIdInfo = document.getElementById('testIdInfo');
        const timeInfo = document.getElementById('timeInfo');
        const dataSourceBadge = document.getElementById('dataSourceBadge');

        // ================================================================
        // 🧠 STATE
        // ================================================================
        let isTesting = false;
        let bestDownloadSpeed = 0;
        let bestUploadSpeed = 0;
        let bestPeakSpeed = 0;

        // ================================================================
        // 🔧 HELPERS
        // ================================================================
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function updateBestSpeeds(download, upload, peak) {
            if (download > bestDownloadSpeed) {
                bestDownloadSpeed = download;
                bestDownload.textContent = bestDownloadSpeed + ' Mbps';
            }
            if (upload > bestUploadSpeed) {
                bestUploadSpeed = upload;
                bestUpload.textContent = bestUploadSpeed + ' Mbps';
            }
            if (peak > bestPeakSpeed) {
                bestPeakSpeed = peak;
                bestPeak.textContent = bestPeakSpeed + ' Mbps';
            }
        }

        // ================================================================
        // 🎯 UPDATE UI WITH DATA
        // ================================================================
        function updateUI(data) {
            // Main speeds
            mainSpeed.innerHTML = data.download + '<span>Mbps</span>';
            downloadSpeed.innerHTML = data.download + '<span>Mbps</span>';
            uploadSpeed.innerHTML = data.upload + '<span>Mbps</span>';
            
            // Info
            ipAddress.textContent = data.ip || '--';
            serverInfo.textContent = data.server || '--';
            latencyInfo.textContent = (data.ping || '--') + ' ms';
            dataInfo.textContent = randomInt(25, 90) + ' MB';
            
            // ISP & Country
            ispInfo.textContent = data.isp || '--';
            countryInfo.textContent = data.country || '--';
            locationInfo.textContent = data.location || '--';
            
            // Badge
            if (data.real) {
                dataSourceBadge.className = 'real-badge';
                dataSourceBadge.textContent = '🟢 Real Data';
            } else {
                dataSourceBadge.className = 'sim-badge';
                dataSourceBadge.textContent = '🟡 Simulated Data';
            }
            
            // Time
            timeInfo.textContent = getCurrentTime();
            testIdInfo.textContent = 'T' + String(randomInt(100000, 999999));
            
            // Best speeds
            updateBestSpeeds(data.download, data.upload, data.download);
        }

        // ================================================================
        // 🧪 TEST BUTTON - REAL API CALL
        // ================================================================
        testBtn.addEventListener('click', async function() {
            if (isTesting) return;

            isTesting = true;
            testBtn.disabled = true;
            testBtn.textContent = '⏳ Testing...';
            statusLabel.className = 'status testing';
            statusLabel.textContent = '● testing (real data)...';
            progressFill.style.width = '0%';

            // Progress animation
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 5 + 2;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 100);

            try {
                // ============================================================
                // 📡 CALL REAL API
                // ============================================================
                const response = await fetch('/api/speed');
                const data = await response.json();
                
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                
                // Update UI with real data
                updateUI(data);
                
                statusLabel.className = 'status done';
                statusLabel.textContent = '● done ✅';
                testBtn.textContent = '▶ Test Again';
                testBtn.disabled = false;
                isTesting = false;
                
            } catch (error) {
                // ============================================================
                // ⚠️ ERROR - SIMULATED FALLBACK
                // ============================================================
                clearInterval(progressInterval);
                
                console.error('API Error:', error);
                
                // Simulated data
                const simSpeed = randomInt(10, 300);
                const simUpload = Math.floor(simSpeed * (0.2 + Math.random() * 0.4));
                
                const fallbackData = {
                    download: simSpeed,
                    upload: simUpload,
                    ping: randomInt(5, 45),
                    ip: '192.168.' + randomInt(0, 255) + '.' + randomInt(1, 254),
                    server: 'Fallback Server (Simulated)',
                    location: 'India',
                    isp: ['Airtel', 'Jio', 'BSNL', 'ACT Fibernet'][randomInt(0, 3)],
                    country: 'India',
                    real: false
                };
                
                updateUI(fallbackData);
                
                statusLabel.className = 'status error';
                statusLabel.textContent = '⚠️ Using simulated data';
                testBtn.textContent = '▶ Test Again';
                testBtn.disabled = false;
                isTesting = false;
                progressFill.style.width = '100%';
            }
        });

        // ================================================================
        // 🔄 TOGGLE EXTRA DETAILS
        // ================================================================
        toggleDetails.addEventListener('click', function() {
            if (extraDetails.style.display === 'none' || extraDetails.style.display === '') {
                extraDetails.style.display = 'block';
                this.textContent = '📋 Hide extra info ▲';
            } else {
                extraDetails.style.display = 'none';
                this.textContent = '📋 Show extra info ▾';
            }
        });
    </script>
</body>
</html>
